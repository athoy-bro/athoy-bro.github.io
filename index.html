<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATHOY — NFC Profile</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;

    background:
        radial-gradient(circle at 20% 10%, #24201d 0%, transparent 35%),
        radial-gradient(circle at 90% 90%, #211b18 0%, transparent 30%),
        #0b0b0b;

    color: #fff;
    font-family: 'Inter', sans-serif;
}

.card {
    width: 100%;
    max-width: 390px;
    position: relative;
    overflow: hidden;

    padding: 24px;

    background: #111111;
    border: 1px solid #292929;
    border-radius: 20px;

    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.card::before {
    content: "";
    position: absolute;

    width: 180px;
    height: 180px;

    right: -90px;
    top: -90px;

    border: 1px solid rgba(255,125,45,.18);
    border-radius: 50%;
}

.card::after {
    content: "";
    position: absolute;

    width: 120px;
    height: 120px;

    right: -60px;
    top: -60px;

    border: 1px solid rgba(255,125,45,.12);
    border-radius: 50%;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 32px;
}

.nfc {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #777;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 10px;
    color: #777;
}

.status span {
    width: 6px;
    height: 6px;

    border-radius: 50%;
    background: #ff7d32;

    box-shadow: 0 0 8px rgba(255,125,50,.7);
}

.profile {
    display: flex;
    align-items: center;
    gap: 17px;

    margin-bottom: 30px;
}

.avatar {
    width: 78px;
    height: 78px;

    flex-shrink: 0;

    border-radius: 18px;
    overflow: hidden;

    background: linear-gradient(135deg, #272727, #171717);

    border: 1px solid #383838;

    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.name {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 1px;
}

.username {
    margin-top: 4px;
    color: #777;
    font-size: 12px;
}

.bio {
    padding: 15px 0;

    border-top: 1px solid #242424;
    border-bottom: 1px solid #242424;

    color: #aaa;

    font-size: 13px;
    line-height: 1.6;
}

.bio strong {
    color: #eee;
}

.links {
    margin-top: 20px;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.link {
    display: flex;
    align-items: center;

    min-height: 58px;

    padding: 0 15px;

    text-decoration: none;
    color: #ddd;

    background: #161616;

    border: 1px solid #252525;
    border-radius: 12px;

    transition: .18s ease;
}

.link:hover {
    background: #1d1d1d;
    border-color: #3a3a3a;
    transform: translateX(3px);
}

.number {
    width: 30px;

    color: #555;

    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
}

.link-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.link-name {
    font-size: 13px;
    font-weight: 600;
}

.link-desc {
    color: #666;
    font-size: 10px;
}

.footer {
    display: flex;
    justify-content: space-between;

    margin-top: 25px;

    color: #484848;

    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}
</style>
</head>

<body>

<main class="card">

    <div class="top">
        <div class="nfc">NFC / PROFILE</div>

        <div class="status">
            <span></span>
            ONLINE
        </div>
    </div>

    <section class="profile">

        <div class="avatar">
            <img src="profile.jpg" alt="ATHOY">
        </div>

        <div>
            <h1 class="name">ATHOY</h1>
            <p class="username">@athoy_yowis</p>
        </div>

    </section>

    <div class="bio">
        <strong>Student</strong> · Mathematics · Creator
    </div>

    <div class="links">

        <a class="link"
           href="https://www.instagram.com/ada._.wow/"
           target="_blank">

            <span class="number">01</span>

            <span class="link-info">
                <span class="link-name">Instagram</span>
                <span class="link-desc">Content</span>
            </span>

        </a>

        <a class="link"
           href="https://www.instagram.com/athoy_yowis/"
           target="_blank">

            <span class="number">02</span>

            <span class="link-info">
                <span class="link-name">Instagram</span>
                <span class="link-desc">Personal</span>
            </span>

        </a>

        <a class="link"
           href="https://github.com/athoy-bro"
           target="_blank">

            <span class="number">03</span>

            <span class="link-info">
                <span class="link-name">GitHub</span>
                <span class="link-desc">@athoy-bro</span>
            </span>

        </a>

        <a class="link" href="#">

            <span class="number">04</span>

            <span class="link-info">
                <span class="link-name">Projects</span>
                <span class="link-desc">Things I build</span>
            </span>

        </a>

    </div>

    <div class="footer">
        <span>ATHOY / 001</span>
        <span>2026</span>
    </div>

</main>

</body>
</html>
