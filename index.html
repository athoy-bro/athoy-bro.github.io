<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ATHOY — Profile</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;

      background:
        radial-gradient(circle at 50% 0%, #242424 0%, #0d0d0d 42%, #080808 100%);

      color: #fff;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 34px 24px 22px;

      background: rgba(18, 18, 18, 0.92);
      border: 1px solid #292929;
      border-radius: 26px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55);

      text-align: center;
    }

    /* PROFILE PHOTO */
    .avatar {
      width: 105px;
      height: 105px;

      margin: 0 auto 18px;

      border-radius: 50%;
      overflow: hidden;

      border: 2px solid #3a3a3a;
      background: #161616;

      box-shadow:
        0 0 0 6px rgba(255,255,255,0.025),
        0 10px 30px rgba(0,0,0,0.5);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .username {
      margin-top: 5px;
      color: #888;
      font-size: 13px;
    }

    .bio {
      margin: 18px 0 25px;
      color: #b5b5b5;
      font-size: 14px;
      line-height: 1.6;
    }

    /* LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 52px;

      border: 1px solid #303030;
      border-radius: 15px;

      background: #151515;
      color: #f2f2f2;

      text-decoration: none;
      font-size: 14px;
      font-weight: 500;

      transition: 0.2s ease;
    }

    .link:hover {
      background: #202020;
      border-color: #505050;
      transform: translateY(-2px);
    }

    .link:active {
      transform: scale(0.98);
    }

    /* SMALL LABEL */
    .tag {
      display: inline-block;

      margin-bottom: 22px;
      padding: 6px 11px;

      border: 1px solid #303030;
      border-radius: 999px;

      color: #8f8f8f;
      font-size: 11px;
      letter-spacing: 1px;
    }

    footer {
      margin-top: 23px;

      color: #555;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @media (max-width: 400px) {
      .card {
        padding: 30px 20px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="tag">
      NFC PROFILE
    </div>

    <div class="avatar">
      <img src="profile.jpg" alt="ATHOY">
    </div>

    <h1 class="name">ATHOY</h1>

    <p class="username">@athoy_yowis</p>

    <p class="bio">
      Student • Mathematics • Creator
    </p>

    <div class="links">

      <a
        class="link"
        href="https://www.instagram.com/ada._.wow/"
        target="_blank">
        Content
      </a>

      <a
        class="link"
        href="https://www.instagram.com/athoy_yowis/"
        target="_blank">
        Personal
      </a>

      <a
        class="link"
        href="https://github.com/athoy-bro"
        target="_blank">
        GitHub
      </a>

      <a
        class="link"
        href="#"
        target="_blank">
        Projects
      </a>

    </div>

    <footer>
      ATHOY • 2026
    </footer>

  </main>

</body>
</html>
