<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATHOY — Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 35px 25px;
            border: 1px solid #333;
            border-radius: 24px;
            background: #1a1a1a;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .bio {
            color: #aaa;
            margin: 10px 0 28px;
        }

        a {
            display: block;
            padding: 15px;
            margin: 12px 0;
            border-radius: 12px;
            background: #292929;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background: #383838;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="avatar">A</div>

        <h1>ATHOY</h1>

        <p class="bio">
            Student • Creator • Learner
        </p>

        <a href="#">Instagram</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

        <div class="footer">
            NFC Profile • ATHOY
        </div>

    </div>

</body>
</html>
